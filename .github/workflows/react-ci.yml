name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing:
    name: CI ReactJS (Lint and Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          VITE_BASE_API_URL: ${{ secrets.VITE_BASE_API_URL }}
          VITE_STORAGE_URL: ${{ secrets.VITE_STORAGE_URL }}
          VITE_AI_SERVICE_URL: ${{ secrets.VITE_AI_SERVICE_URL }}
          VITE_USE_LARAVEL_AI_GATEWAY: ${{ secrets.VITE_USE_LARAVEL_AI_GATEWAY }}
          VITE_AI_TIMEOUT_MS: ${{ secrets.VITE_AI_TIMEOUT_MS }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

  docker:
    needs: testing
    name: Build and Deploy to Docker Hub
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/spentaru-archive-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}
            VITE_STORAGE_URL=${{ secrets.VITE_STORAGE_URL }}
            VITE_AI_SERVICE_URL=${{ secrets.VITE_AI_SERVICE_URL }}
            VITE_USE_LARAVEL_AI_GATEWAY=${{ secrets.VITE_USE_LARAVEL_AI_GATEWAY }}
            VITE_AI_TIMEOUT_MS=${{ secrets.VITE_AI_TIMEOUT_MS }}
            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
