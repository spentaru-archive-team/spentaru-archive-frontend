name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing:
    name: CI ReactJS (Lint and Build)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Generate production env
      - name: Create .env.production
        run: |
          echo "VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}" >> .env.production
          echo "VITE_STORAGE_URL=${{ secrets.VITE_STORAGE_URL }}" >> .env.production
          echo "VITE_AI_SERVICE_URL=${{ secrets.VITE_AI_SERVICE_URL }}" >> .env.production
          echo "VITE_USE_LARAVEL_AI_GATEWAY=${{ secrets.VITE_USE_LARAVEL_AI_GATEWAY }}" >> .env.production
          echo "VITE_AI_TIMEOUT_MS=${{ secrets.VITE_AI_TIMEOUT_MS }}" >> .env.production
          echo "VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}" >> .env.production

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

  build:
    needs: testing
    name: Build and Deploy to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/spentaru-archive-frontend:latest
