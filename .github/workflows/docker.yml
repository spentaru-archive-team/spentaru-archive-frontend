name: Docker CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Generate production env
      - name: Create .env.production
        run: |
          echo "VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}" >> .env.production
          echo "VITE_STORAGE_URL=${{ secrets.VITE_STORAGE_URL }}" >> .env.production
          echo "VITE_AI_SERVICE_URL=${{ secrets.VITE_AI_SERVICE_URL }}" >> .env.production
          echo "VITE_USE_LARAVEL_AI_GATEWAY=${{ secrets.VITE_USE_LARAVEL_AI_GATEWAY }}" >> .env.production
          echo "VITE_AI_TIMEOUT_MS=${{ secrets.VITE_AI_TIMEOUT_MS }}" >> .env.production
          echo "VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}" >> .env.production

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spentaru-frontend:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/spentaru-frontend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max